<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Pricedown; src: url(pricedown.otf); }
@font-face { font-family: Dafoe; src: url(dafoe.ttf); }
@font-face { font-family: BeVN; src: url(bevn.ttf); }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #12021f; }
.stage { position: relative; width: 1280px; height: 640px; overflow: hidden;
  background: linear-gradient(180deg, #12021f 0%, #3a0a5e 30%, #b0177a 58%, #ff5f6d 72%, #ffb347 80%); }
svg.bg { position: absolute; inset: 0; }
.title { position: absolute; left: 0; right: 0; top: 20px; text-align: center;
  font-family: Pricedown; font-size: 138px; letter-spacing: 6px; color: #fff;
  -webkit-text-stroke: 7px #0b0014; paint-order: stroke fill;
  text-shadow: 7px 7px 0 #ff2a8a, 13px 13px 0 #0b0014, 0 0 40px rgba(255,42,138,.55); }
.script { position: absolute; left: 0; right: 0; top: 286px; text-align: center;
  font-family: Dafoe; font-size: 220px; line-height: 1; color: #ff5fe0;
  -webkit-text-stroke: 6px #1a0230; paint-order: stroke fill;
  text-shadow: 0 0 18px #ff4fd8, 0 0 42px #ff2a8a, 6px 6px 0 #0b0014; }
.word { position: relative; display: inline-block; isolation: isolate; }
.sk { position: relative; z-index: auto; display: inline-block; color: #c9a3d9; }
.strike { position: absolute; left: -22px; right: -26px; top: 50%; height: 20px; z-index: 0;
  background: #3df5ff; border-radius: 8px; transform: rotate(-12deg);
  box-shadow: 0 0 10px #3df5ff, 0 4px 0 #0b0014; }
.dr { position: absolute; left: 0; top: 0; font-size: 220px; line-height: 1; color: #ffe14d; z-index: 50; opacity: 1;
  transform: none; -webkit-text-stroke: 9px #0b0014; paint-order: stroke fill;
  text-shadow: 0 0 10px #fff6b0, 0 0 26px #ffe14d, 0 0 50px #ff9a3c, 7px 7px 0 #0b0014; }

.word { display: inline-flex; align-items: baseline; }
.stack { display: inline-grid; justify-items: center; align-items: center; }
.stack > span { grid-area: 1 / 1; font: inherit; line-height: 1; }
.sk { position: relative; color: #e2c2f2; z-index: 1; -webkit-text-stroke: 6px #1a0230; paint-order: stroke fill; }
.sk::after { content: ""; position: absolute; left: -14%; right: -14%; top: 52%; height: 22px;
  background: #3df5ff; border-radius: 10px; transform: rotate(-12deg);
  box-shadow: 0 0 10px #3df5ff, 0 4px 0 #0b0014; }
.dr { z-index: 2; color: #ffe14d; -webkit-text-stroke: 9px #0b0014; paint-order: stroke fill;
  transform: scale(.84) rotate(-4deg); transform-origin: center;
  text-shadow: 0 0 10px #fff6b0, 0 0 26px #ffe14d, 0 0 50px #ff9a3c, 7px 7px 0 #0b0014; }
.tag { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center;
  font-family: BeVN; font-size: 30px; letter-spacing: 3px; color: #fff;
  text-shadow: 0 0 12px #3df5ff, 3px 3px 0 #0b0014; }
.tag b { color: #ffe14d; }
</style>
</head>
<body>
<div class="stage">
<svg class="bg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>

    <line x1="560" y1="574" x2="720" y2="574"/>
  </g>
  <line x1="0" y1="512" x2="1280" y2="512" stroke="#ffb347" stroke-width="2"/>
  <g fill="#0b0014">
    <path d="M120 640 C 128 520, 150 400, 205 300 L 215 304 C 166 400, 146 520, 142 640 Z"/>
    <path d="M208 300 C 150 270, 90 280, 30 330 C 95 300, 150 296, 205 312 Z"/>
    <path d="M208 300 C 170 240, 110 220, 50 230 C 110 245, 160 268, 200 310 Z"/>
    <path d="M208 300 C 240 240, 300 215, 360 225 C 300 240, 250 270, 214 312 Z"/>
    <path d="M208 300 C 270 280, 330 295, 380 345 C 320 315, 265 305, 212 314 Z"/>
    <path d="M208 300 C 205 245, 225 200, 265 170 C 238 210, 222 255, 216 306 Z"/>
  </g>
  <g fill="#0b0014" transform="translate(1280 0) scale(-1 1)">
    <path d="M90 640 C 95 540, 112 440, 160 360 L 170 364 C 126 440, 110 540, 110 640 Z"/>
    <path d="M163 360 C 110 335, 60 345, 10 385 C 65 362, 112 358, 160 372 Z"/>
    <path d="M163 360 C 130 310, 80 292, 30 300 C 82 312, 125 332, 156 370 Z"/>
    <path d="M163 360 C 190 310, 240 290, 290 298 C 240 312, 200 336, 168 372 Z"/>
    <path d="M163 360 C 215 345, 265 358, 305 398 C 255 374, 210 366, 166 374 Z"/>
  </g>
</svg>
<div class="title">VIETNAMESE</div>
<div class="script"><span class="word"><span class="stack"><span class="sk">sk</span><span class="dr">dr</span></span><span>ill</span></span></div>
<div class="tag">tiếng Việt <b>mượt</b> như beat drill · skills · rules · i18n</div>
</div>
</body>
</html>
